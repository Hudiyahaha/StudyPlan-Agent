services:
  - type: web
    name: studyplan-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: MODEL_PROVIDER
        value: groq
      - key: MODEL_NAME
        value: openai/gpt-oss-20b
      - key: FALLBACK_MODELS
        value: openai/gpt-oss-120b,qwen/qwen3.8-27b
      - key: GROQ_API_KEY
        sync: false
      - key: MAX_STEPS
        value: "6"
      - key: MAX_TOOL_RETRIES
        value: "2"
      - key: TIMEZONE
        value: Asia/Karachi
