services:
  - type: web
    name: studyplan-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: MODEL_PROVIDER
        value: mock
      - key: MODEL_NAME
        value: studyplan-mock-v1
      - key: MAX_STEPS
        value: "6"
      - key: MAX_TOOL_RETRIES
        value: "2"
